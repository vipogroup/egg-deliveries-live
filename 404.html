<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>משלוחים</title>
    <script>
      if (new URLSearchParams(location.search).get('desk') === '1') {
        document.querySelector('link[rel="manifest"]').href = './desk.webmanifest'
      }
      if ('serviceWorker' in navigator) {
        let reloaded = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return
          reloaded = true
          location.reload()
        })
        navigator.serviceWorker.register('./sw.js').then((reg) => reg.update())
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DAWfwBYI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CCfojrLt.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.vipoCallQueue = window.vipoCallQueue || []
      window.vipoCall = function (event) {
        if (window.vipoCallReady) return window.vipoCallReady(event) === true
        window.vipoCallQueue.push(event)
        return true
      }
      window.vipoMissedQueue = window.vipoMissedQueue || []
      window.vipoMissed = function (rows) {
        if (window.vipoMissedReady) return window.vipoMissedReady(rows) === true
        if (Array.isArray(rows)) window.vipoMissedQueue.push.apply(window.vipoMissedQueue, rows)
        return true
      }
    </script>
  </body>
</html>
